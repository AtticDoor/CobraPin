#config_version=5

hardware:
  platform: opp
  driverboards: gen2


opp:
  #Use the USB ports defined by your OS for the two STM32 boards
  ports: COM3, COM6
  #/dev/ttyACM0, /dev/ttyACM1
  #USING SERIAL NUMBERS INSTEAD OF CHAINS
  #  Board 0 has serial number 0, Board 1 has serial number 1.
  #  This is convenient if your OS tends to reassign the serial port.
  #  MPF will automatically address the correct board even if the ports
  #     are swapped.

  #For multiple CobraPin boards in a game, you will either have to give
  #  the STM32 boards on the second CobraPin board new serial numbers
  #  (10 and 11 are suggested for the 2nd board since 2 is used by the
  #  CobraPin Xpansion Board)
  #  <OR> Use the chains section to assign a port to a board number.
  #  Mixing these up could cause blown FETs, coils, and fuses. Proceed
  #  with caution. Test without coil power and use the yellow coil LEDs
  #  for feedback.
  #chains:
  #  0: COM3
  #  1: COM6

psus:
  default:
    #Gives the capacitors extra time to recharge after firing a coil
    #  and eases the load on the power supply. Doesn't affect autofire
    #  devices like flippers, pops, slings.
    release_wait_ms: 50
    
modes:
  - base
#  - mode2
  - attract
  - skillshot
  - top_lanes
#  - targetmode


config:
  - config_lights.yaml  
  - config_sound.yaml
  - config_switches.yaml
  - config_keyboard.yaml
  - config_coils.yaml
     
ball_devices:
  bd_drain:
    ball_switches: s_drain
    eject_coil: c_drain_eject
    eject_targets: bd_plunger_lane
    tags: drain, home, trough
    eject_timeouts: 3s
    debug: true

  bd_plunger_lane:
    ball_switches: s_plunger
    mechanical_eject: true
    eject_timeouts: 5s     
    player_controlled_eject_event: sw_plunger  
    
playfields:
  playfield:
    tags: default
    default_source_device: bd_plunger_lane

flippers:
  left_flipper:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_left_flipper
  right_flipper:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_right_flipper

displays:
  window:
    width: 800
    height: 600  
  dmd:
    width: 800
    height: 600  
    default: true

  my_frame:
    width: 800
    height: 600

slides:
  window_slide:
    - type: display
      effects:
        - type: color_dmd
          dot_size: .5
      width: 800
      height: 600
  dmd_slide:
    - type: text
      text: DOTS!
    - type: rectangle
      width: 120
      height: 30
      color: orange
      y: 0
      anchor_y: bottom
    - type: rectangle
      width: 120
      height: 30
      color: red
      y: top
      anchor_y: top      
  welcome_slide:
    widgets:
      - type: text
        text: PINBALL!
        font_size: 50
        color: red
      - type: rectangle
        width: 240
        height: 60
  yo_slide:
    widgets:
      - type: text
        text: YO!
        font_size: 50
        color: red
      - type: rectangle
        width: 240
        height: 60
  attract_started:
    widgets:
      - text: ATTRACT MODE
        type: text
  default_saving_ball:
    widgets:
      - type: text
        text: BALL SAVE!
        font_size: 100
        color: blue
      - type: rectangle
        width: 500
        height: 80  
      - type: text
        text: PLAYER (number) KEEP SHOOTING
        font_size: 50
        color: green    
        y: 200       
    priority: 600   
  default_extra_ball:
    widgets:
      - type: text
        text: EXTRA BALL!
        font_size: 100
        color: blue
      - type: rectangle
        width: 500
        height: 80  
      - type: text
        text: PLAYER (number) KEEP SHOOTING
        font_size: 50
        color: green    
        y: 200       
    priority: 600     
  new_ball:   
    widgets:
      type: text
      text: PLAYER (number) BALL (ball)  
    priority: 0   
  slide_ball_started:
    widgets:
      - type: text
        text: (score)
        number_grouping: true
        min_digits: 2
        font_size: 100
      - type: text
        text: PLAYER (number)
        y: 10
        x: 10
        font_size: 50
        anchor_x: left
        anchor_y: bottom
      - type: text
        text: BALL (ball)
        y: 10
        x: right-10
        anchor_x: right
        anchor_y: bottom
        font_size: 50
    priority: 100        

  slide_skillshot:
    widgets:
      - type: text
        text: SKILL SHOT!
        font_size: 100
        color: blue
      - type: rectangle
        width: 500
        height: 80       
    priority: 600    
    
slide_player:
  init_done:
    window_slide:
      target: window
    dmd_slide:
      target: dmd  
  mode_attract_started: attract_started
  ball_save_default_saving_ball: 
    default_saving_ball:   
      priority: 701 
      expire: 5s
      transition:
        type: push
        duration: 2s
        direction: right
      transition_out:
        type: fade_back  
  extra_ball_score_one_awarded:
    default_extra_ball:   
      priority: 701 
      expire: 5s    
      transition:
        type: push
        duration: 2s
        direction: right
      transition_out:
        type: fade_back       
      

ball_saves:
  default:
    active_time: 5s
    hurry_up_time: 2s
    grace_period: 2s
    enable_events: ball_started #mode_base_started
    timer_start_events:   balldevice_bd_plunger_lane_ball_eject_success
    #bd_plunger_lane:
    #auto_launch: true
    balls_to_save: 1
    debug: true      
    
    
    
show_player:
  ball_save_default_timer_start:
    lighton:
      action: play
      loops: 3
      speed: 1
      priority: 701
      show_tokens:
        led: 0_led7         
        color: blue  
  ball_save_default_hurry_up:
    light_blink:
      action: play
      loops: 5
      speed: 10
      priority: 701
      show_tokens:
        led: 0_led7         
        color: blue 
  ball_save_default_saving_ball:
    light_blink:
      action: play
      loops: 10
      speed: 10
      priority: 701
      show_tokens:
        led: 0_led7         
        color: blue
  skill_success:
    lighton:
      action: stop
    light_blink:
      action: play
      loops: 5
      speed: 20 
      priority: 701
      show_tokens:
        led: 0_led_skillshot   
        color: yellow 
        
sound_player:
  mode_base_stopped:
    music_bg1:
      action: stop