#config_version=6

hardware:
  platform: opp
  driverboards: gen2

opp:
  ports: COM4, COM3

psus:
  default:
    release_wait_ms: 50

game:
  balls_per_game: 3
  max_players: 4

machine:
  balls_installed: 2

modes:
  - base
  - attract
  - skillshot
  - top_lanes
  - upsidedown

config:
  - config_coils.yaml
  - config_events.yaml
  # - config_keyboard.yaml  # removed: deprecated in MPF 0.81 (use gmc.cfg instead)
  - config_lights.yaml  
  - config_shots.yaml
  - config_switches.yaml
  - config_variables.yaml
  # - config_sound.yaml
  # - config_videos.yaml

ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5        
    eject_coil: c_trough_upkicker
    tags: drain, home, trough
    eject_targets: bd_plunger_lane

  bd_plunger_lane:
    ball_switches: s_shooter_lane
    eject_coil: c_auto_launch  
    mechanical_eject: true
    eject_timeouts: 5s      
    player_controlled_eject_event: s_ball_launch_button_active  

  bd_vuk_left:
    ball_switches: s_vuk_left
    eject_coil: c_vuk_left

  bd_multiball_virtual_lock:
    eject_coil: c_trough_upkicker
    ball_switches: s_lr_standup

playfields:
  playfield:
    default_source_device: bd_plunger_lane
    tags: default
    enable_ball_search: false
    ball_search_timeout: 20s
    ball_search_wait_after_iteration: 10s
    ball_search_interval: 250ms    

flippers:
  left_flipper:
    main_coil: c_flipper_left
    activation_switch: s_flipper_left  
    enable_events: ball_started, enableAutofire
    disable_events: ball_will_end, service_mode_entered, disableAutofire    
  right_flipper:
    main_coil: c_flipper_right
    activation_switch: s_flipper_right
    enable_events: ball_started, enableAutofire
    disable_events: ball_will_end, service_mode_entered, disableAutofire  
  upper_right_flipper:
    main_coil: c_flipper_upper_right
    activation_switch: s_flipper_right
    enable_events: ball_started, enableAutofire
    disable_events: ball_will_end, service_mode_entered, disableAutofire  

ball_saves:
  default:
    active_time: 5s
    hurry_up_time: 2s
    grace_period: 2s
    enable_events: ball_started
    timer_start_events: balldevice_bd_plunger_lane_ball_eject_success
    balls_to_save: 1
    debug: true
