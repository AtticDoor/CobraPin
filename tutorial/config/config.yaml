ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5        
    eject_coil: c_trough_upkicker
    tags: drain, home, trough
    eject_targets: bd_plunger_lane

  bd_plunger_lane:
    ball_switches: s_shooter_lane
    eject_coil: c_auto_launch  
    mechanical_eject: true
    eject_timeouts: 5s      
    player_controlled_eject_event: s_ball_launch_button_active  
  # ballsearch_upper_vuk:
    # hold_coil: c_upper_vuk
    # ball_switches: s_upper_vuk
    # eject_timeouts: 2s
    # debug: true 
    # ball_search_order: 1
    
  #bd_shark:
  #  ball_switches: s_shark_scoop
  #  eject_coil: c_shark_scoop
  bd_vuk_left:
    ball_switches: s_vuk_left
    eject_coil: c_vuk_left
    #  tags: drain, home, trough
    #  eject_targets: bd_plunger_lane    
    
playfields:
  playfield:
    default_source_device: bd_plunger_lane
    tags: default
    enable_ball_search: false # true
    ball_search_timeout: 20s
    ball_search_wait_after_iteration: 10s
    ball_search_interval: 250ms    

player_vars:
  current_mode:
    initial_value: Trees Attack
    value_type: str
  bumper_hits:
    initial_value: 0
    value_type: int
  super_bonus_multipler:
    initial_value: 1.25
    value_type: float
    

flippers:
  left_flipper:
    main_coil: c_flipper_left
    #hold_coil: c_flipper_left_hold
    activation_switch: s_flipper_left  
    #enable_events: machine_reset_phase_3, ball_starting, cmode_game_started, game_start, ball_started, mode_base_started, flipper_on 
    #disable_events: ball_will_end, flipper_off
    
    enable_events: ball_started, enableAutofire
    disable_events: ball_will_end, service_mode_entered, disableAutofire    
  right_flipper:
    main_coil: c_flipper_right
    #hold_coil: c_flipper_right_hold
    activation_switch: s_flipper_right
    #enable_events: machine_reset_phase_3, ball_starting, cmode_game_started, game_start, ball_started, mode_base_started, flipper_on 
    #disable_events: ball_will_end, flipper_off
   
    enable_events: ball_started, enableAutofire
    disable_events: ball_will_end, service_mode_entered, disableAutofire  
  upper_right_flipper:
    main_coil: c_flipper_upper_right
    #hold_coil: c_flipper_right_hold
    activation_switch: s_flipper_right
    #enable_events: machine_reset_phase_3, ball_starting, cmode_game_started, game_start, ball_started, mode_base_started, flipper_on 
    #disable_events: ball_will_end, flipper_off
    #label: Upper Right Flipper
    enable_events: ball_started, enableAutofire
    disable_events: ball_will_end, service_mode_entered, disableAutofire  
  
    
machine:
  balls_installed: 2




displays:
  window:
    width: 800
    height: 600  
    #left: 0
    #top: 0
  dmd:
    width: 800
    height: 600  
    default: true

  my_frame:
    width: 800
    height: 600

slides:
  window_slide:
    - type: display
 #     effects:
 #       - type: color_dmd
 #         dot_size: .5
      width: 800
      height: 600
  dmd_slide:
    - type: text
      text: DOTS!
    - type: rectangle
      width: 120
      height: 30
      color: orange
      y: 0
      anchor_y: bottom
    - type: rectangle
      width: 120
      height: 30
      color: red
      y: top
      anchor_y: top      
  welcome_slide:
    widgets:
      - type: text
        text: PINBALL!
        font_size: 50
        color: red
      - type: rectangle
        width: 240
        height: 60
  yo_slide:
    widgets:
      - type: text
        text: YO!
        font_size: 50
        color: red
      - type: rectangle
        width: 240
        height: 60
  attract_started:
    widgets:
      - text: ATTRACT MODE
        type: text  
  default_saving_ball:
    widgets:
      - type: text
        text: BALL SAVE!
        font_size: 100
        color: blue
      - type: rectangle
        width: 500
        height: 80  
      - type: text
        text: PLAYER (number) KEEP SHOOTING
        font_size: 50
        color: green    
        y: 200       
    priority: 600   
  default_extra_ball:
    widgets:
      - type: text
        text: EXTRA BALL!
        font_size: 100
        color: blue
      - type: rectangle
        width: 500
        height: 80  
      - type: text
        text: PLAYER (number) KEEP SHOOTING
        font_size: 50
        color: green    
        y: 200       
    priority: 600     
  new_ball:   
    widgets:
      type: text
      text: PLAYER (number) BALL (ball)  
    priority: 0   
  slide_ball_started:
    widgets:
      - type: text
        text: (score)
        number_grouping: true
        min_digits: 2
        font_size: 100
      - type: text
        text: PLAYER (number)
        y: 10
        x: 10
        font_size: 50
        anchor_x: left
        anchor_y: bottom
      - type: text
        text: BALL (ball)
        y: 10
        x: right-10
        anchor_x: right
        anchor_y: bottom
        font_size: 50
    priority: 100        

  slide_skillshot:
    widgets:
      - type: text
        text: SKILL SHOT!
        font_size: 100
        color: blue
      - type: rectangle
        width: 500
        height: 80       
    priority: 600    
    
slide_player:
  init_done:
    window_slide:
      target: window
    dmd_slide:
      target: dmd  
  mode_attract_started: attract_started
  ball_save_default_saving_ball: 
    default_saving_ball:   
      priority: 701 
      expire: 5s
      transition:
        type: push
        duration: 2s
        direction: right
      transition_out:
        type: fade_back  
  extra_ball_score_one_awarded:
    default_extra_ball:   
      priority: 701 
      expire: 5s    
      transition:
        type: push
        duration: 2s
        direction: right
      transition_out:
        type: fade_back       
      

ball_saves:
  default:
    active_time: 5s
    hurry_up_time: 2s
    grace_period: 2s
    enable_events: ball_started #mode_base_started
    timer_start_events:   balldevice_bd_plunger_lane_ball_eject_success
    # bd_plunger_lane:
    # auto_launch: true
    balls_to_save: 1
    debug: true      
  # kickback_ball_save:
    # active_time: 5s
    # enable_events: kickback_kb_outlane_kickback_fired
    # auto_launch: true
    # balls_to_save: 1
    
    
show_player:
  ball_save_default_timer_start:
    lighton:
      action: play
      loops: 3
      speed: 1
      priority: 701
      show_tokens:
        led: 0_led7         
        color: blue  
  ball_save_default_hurry_up:
    light_blink:
      action: play
      loops: 5
      speed: 10
      priority: 701
      show_tokens:
        led: 0_led7         
        color: blue 
  ball_save_default_saving_ball:
    light_blink:
      action: play
      loops: 10
      speed: 10
      priority: 701
      show_tokens:
        led: 0_led7         
        color: blue
  skill_success:
    lighton:
      action: stop
    light_blink:
      action: play
      loops: 5
      speed: 20 
      priority: 701
      show_tokens:
        led: 0_led_skillshot   
        color: yellow 
        
sound_player:
