#config_version=5

coils:
  c_flipper_left_main:
    number: 0-0-10
    default_pulse_ms: 20
  c_flipper_left_hold:
    number: 0-0-1
    default_pulse_ms: 10
    allow_enable: true
    
  c_flipper_right_main:
    number: 0-0-3
    default_pulse_ms: 10
  c_flipper_right_hold:
    number: 0-0-4
    allow_enable: true
  c_drain_eject:
    number: 0-0-5
    default_pulse_ms: 30
 
  c_left_slingshot:
    number: 1-0-2
  c_right_slingshot:
    number: 0-0-6
    
    
autofire_coils:
  left_slingshot:
    coil: c_left_slingshot
    switch: s_left_slingshot
  right_slingshot:
    coil: c_right_slingshot
    switch: s_right_slingshot

