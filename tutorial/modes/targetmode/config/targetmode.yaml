#config_version=6
# mode2 config file

mode:
  start_events: targetmode_start
  stop_events: targetmode_stop, ball_ended
  priority: 200

#config_version=6
mode:
  start_events: targetmode_start
  stop_events: targetmode_end
  game_mode: False

event_player:
    test_event_player_mode1:
        - test_event_player_mode2
        - test_event_player_mode3

random_event_player:
    test_random_event_player_mode1:
      scope: machine
      events:
        - test_random_event_player_mode2
        - test_random_event_player_mode3
    test_random_event_player_weighted:
      scope: machine
      force_different: False
      force_all: False
      events:
        out3: 1
        out4: 1000

