#config_version=5
##! mode: ball_bonus
mode:
  start_events: ball_ending     # start on ball ending process
  use_wait_queue: true          # delay ball ending
  priority: 500                 # determines the order of ball end modes
  stop_events: stop_my_mode     # post this event to stop the mode and continue the ball ending process
  duration: 10s
  
# variable_player:
  # ramp_shot_hit:
    # bonus_ramps: 1
  # s_target1_active:
    # some_variable: 1  
    
    
    
##! mode: bonus
#config_version=5
mode_settings:
  display_delay_ms: 1s
  hurry_up_delay_ms: 0
  bonus_entries:
    - event: bonus_ramps
      score: 400
    - event: bonus_math
      score: 1200 * (current_player.some_variable + 2)
slide_player:
  mode_bonus_started: bonus_start_slide
  bonus_ramps: bonus_ramp_slide
  bonus_math: bonus_math_slide
  bonus_total: bonus_total_slide
slides:
  bonus_start_slide:
    widgets:
      - type: text
        text: Bonus
  bonus_ramp_slide:
    - type: text
      text: "Ramps (player|level)"
    - type: text
      text: (score)
  bonus_math_slide:
    - type: text
      text: "Some variable (player|some_variable)"
    - type: text
      text: (score)
  bonus_multiplier_slide:
    - type: text
      text: "Multiplier"
    - type: text
      text: "(multiplier)X"
  bonus_total_slide:
    - type: text
      text: "Total Bonus"
    - type: text
      text: (score)