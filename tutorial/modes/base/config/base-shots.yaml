#config_version=6

shot_profiles:
  my_first_profile:
    states:
      - name: unlit  # step 1
        show: off
      - name: flashing  # step 2
        show: flash
      - name: lit  # step 3
        show: on
    loop: true

shots:
  my_first_shot:
    switch: s_vuk_left
    show_tokens:
      led: l_led1 
    profile: my_first_profile
    
    
