#config_version=5
mode:
  start_events: ball_started
  priority: 100

variable_player:
  my_first_shot_my_first_profile_unlit_hit:
    score: 100
  my_first_shot_my_first_profile_flashing_hit:
    score: 1000
   


extra_balls:
  score_one:
    enabled: true
    award_events: player_score{value>=10000}
  score_two:
    enabled: true
    award_events: player_score{value>=210000}
  score_three:
    enabled: true
    award_events: player_score{value>=300000}


shot_profiles:
  my_first_profile:
    states:
      - name: unlit  # step 1
        show: off
      - name: flashing  # step 2
        show: flash
      - name: lit  # step 3
        show: on
    loop: true

shots:
  my_first_shot:
    switch: s_right_inlane  
    show_tokens:
      led: l_led1 
    profile: my_first_profile

slide_player:
  mode_base_started: slide_ball_started
 
        
sound_player:
  mode_base_started:
    music_bg1:
      loops: -1
  s_right_inlane_active:
    sfx_fail: 
      loops: 0
  s_left_inlane_active:
    sfx_fail: 
      loops: 0 
  balldevice_bd_plunger_lane_ball_eject_success:
    waiting_to_plunge_loop:
      loops: -1
  sw_plunger:
    sfx_fail:
      loops: -1
   