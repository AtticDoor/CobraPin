#config_version=5
mode:
  start_events: ball_started, ball_starting
  priority: 100

variable_player:
  my_first_shot_my_first_profile_unlit_hit:
    score: 100
  my_first_shot_my_first_profile_flashing_hit:
    score: 1000
  drop_target_bank_left_bank_down: 
    score: 7
  ramp_shot_hit:
    bonus_ramps: 1
  s_left_outlane_active:
    some_variable: 1  

  s_flipper_left_active{current_player.l_vuk_power<40}:
    l_vuk_power: 5
  s_flipper_left_active{current_player.l_vuk_power>=40}:
    l_vuk_power:
      int: 10
      action: set 

      
##  s_flipper_left_active:
 #   l_vuk_power: 5 if (current_player.l_vuk_power<20) else reset_l_vuk #-20
    #  int: 25 if player.l_vuk_power < 20 else 10
    #  action: set
    #  int: 25 #25 if (player.l_vuk_power<20) else 15         # sets the player's "ramps" variable to 0.
    #  action: set 






event_player:
  reset_l_vuk:
    l_vuk_power: 
      int: current_player.l_vuk_power = 10
      action: set

extra_balls:
  score_one:
    enabled: true
    award_events: player_score{value>=10000}
  score_two:
    enabled: true
    award_events: player_score{value>=210000}
  score_three:
    enabled: true
    award_events: player_score{value>=300000}


  


shot_profiles:
  my_first_profile:
    states:
      - name: unlit  # step 1
        show: off
      - name: flashing  # step 2
        show: flash
      - name: lit  # step 3
        show: on
    loop: true

shots:
  my_first_shot:
    switch: s_vuk_left
    show_tokens:
      led: l_led1 
    profile: my_first_profile

slide_player:
  mode_base_started: slide_ball_started
 
        
sound_player:
  mode_base_started:
    music_bg1:
      loops: -1
  s_left_outlane_active:
    sfx_fail: 
      loops: 0
  s_right_outlane_active:
    sfx_fail: 
      loops: 0 
  balldevice_bd_plunger_lane_ball_eject_success:
    waiting_to_plunge_loop:
      loops: -1
  sw_plunger:
    sfx_fail:
      loops: -1
   
   
   
 