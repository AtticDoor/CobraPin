#config_version=6
mode:
  start_events: ball_started, ball_starting
  stop_events: game_ended, service_mode_entered, ball_drained, ball_ended, mode_base_ended, player_turn_ended
  priority: 100

config:
  - base-shots.yaml

variable_player:
  my_first_shot_my_first_profile_unlit_hit:
    score: 100
  my_first_shot_my_first_profile_flashing_hit:
    score: 1000
  drop_target_bank_left_bank_down: 
    score: 7
  ramp_shot_hit:
    bonus_ramps: 1
  s_left_outlane_active:
    some_variable: 1  

  s_flipper_left_active{current_player.l_vuk_power<40}:
    l_vuk_power: 5
  s_flipper_left_active{current_player.l_vuk_power>=40}:
    l_vuk_power:
      int: 10
      action: set 

  carousel_left_scoop_scene_selected:
    current_ladder:
      action: set
      string: 'Scene 1'

  shot_drop_1_hit:
    drop_1:
      action: set
      string: '1'  
    current_ladder:
      action: set
      string: 'Scene 1'
  shot_drop_2_hit:
    drop_2:
      action: set
      string: '1'  
  shot_drop_3_hit:
    drop_3:
      action: set
      string: '1'   

event_player:
  reset_l_vuk:
    l_vuk_power: 
      int: current_player.l_vuk_power = 10
      action: set

  mode_base_started:
     reset_events:
       reset_drop_target: 1s

  s_left_inlane_active:
    - reset_drop_target_values
    
  shot_drop_1_hit{current_player.drop_2=='1'}: 
    - reset_drop_target
    - reset_drop_target_values

  shot_drop_1_hit{current_player.drop_3=='1'}: 
    - reset_drop_target
    - reset_drop_target_values

  shot_drop_2_hit{current_player.drop_1!='1'}: 
    - reset_drop_target
    - reset_drop_target_values

  shot_drop_2_hit{current_player.drop_3=='1'}: 
    - reset_drop_target
    - reset_drop_target_values
  shot_drop_3_hit{current_player.drop_1!='1'}: 
    - reset_drop_target
    - reset_drop_target_values

  shot_drop_3_hit{current_player.drop_2!='1'}: 
    - reset_drop_target
    - reset_drop_target_values

  reset_drop_target_values:  
    drop_2:
      action: set
      string: '4'

extra_balls:
  score_one:
    enabled: true
    award_events: player_score{value>=10000}
  score_two:
    enabled: true
    award_events: player_score{value>=210000}
  score_three:
    enabled: true
    award_events: player_score{value>=300000}

# sound_player and slide_player removed for MPF 0.81 + VPE Unity.
# Reimplement media via VPE components listening to events/modes.
