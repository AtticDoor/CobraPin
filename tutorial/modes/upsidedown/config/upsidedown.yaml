#config_version=6

mode:
  start_events: upsidedown_start
  stop_events: upsidedown_stop
  priority: 1000

widgets:
  upsidedown_start_banner:
    type: text
    text: UPSIDE DOWN STARTED
    font_size: 50
    color: lime
    y: 80%
    expire: 1s

widget_player:
  mode_upsidedown_started: upsidedown_start_banner

